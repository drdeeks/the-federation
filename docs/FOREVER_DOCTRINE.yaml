version: "2.0.0"
doctrine_id: "federation-operating-principles"
generated: "2026-08-14"
source: "repository-governed-operating-principles"

purpose: >
  This file defines repository working rules only. It is not product truth,
  does not define The Federation civilization, and contains no authorship,
  collaborator, sponsor, model, or ownership claim.

principles:
  - id: "POL-001"
    name: "singular_source_of_truth"
    rule: "Each concern has one active owner and one authoritative source."
    test: "Duplicate active documents are resolved or moved to .trash/legacy."
  - id: "POL-002"
    name: "explicit_boundaries"
    rule: "Subsystems communicate through documented APIs and derived context."
    test: "No subsystem reads another subsystem private files or mutable state."
  - id: "POL-003"
    name: "layered_reversible_change"
    rule: "Changes are scoped, versioned, reviewable, and recoverable."
    test: "Every phase has a rollback procedure and a change-log entry."
  - id: "POL-004"
    name: "fail_closed"
    rule: "Ambiguous policy, missing scope, invalid provenance, and unsafe
      authorization stop the action."
    test: "Blocked operations produce an auditable failure and do not execute."
  - id: "POL-005"
    name: "truth_before_presentation"
    rule: "Interfaces may summarize or present events but cannot rewrite
      immutable monitored action records."
    test: "Every local event projection retains source ID, time, status, and
      provenance."
  - id: "POL-006"
    name: "repository_first"
    rule: "Work remains in the declared target repository until its phase gate
      is complete."
    test: "Sibling repositories are not modified during the current sequence."
  - id: "POL-007"
    name: "attribution_safety"
    rule: "Technical integrations may be disclosed factually; authorship,
      sponsorship, collaboration, ownership, and AI attribution are never
      inferred."
    test: "Submission-facing scans contain only user-approved factual claims."
  - id: "POL-008"
    name: "recoverable_organization"
    rule: "Redundant documentation moves to .trash/legacy rather than being
      irreversibly deleted."
    test: "Legacy moves retain their original names and a recoverable path."

enforcement:
  blueprint: "blueprint.md"
  checklist: "checklist.md"
  change_log: "CHANGELOG.md"
  active_concept: "docs/FEDERATION-CONCEPT.md"
  active_scope: "docs/BUILD_SCOPE.md"
  active_provenance: "docs/PROVENANCE.md"
