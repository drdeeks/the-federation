# END OF DOCTRINE
# ════════════════════════════════════════════════════════════════════════════════

footer:
  note: "This document is itself a layer: v1, supersedes nothing, authored by drdeeks. Amend by adding a new numbered policy or a new layer pointer — never by silent edit of an existing rule's meaning."
  test: "Run test_of_forever checklist. All 7 must be YES."
  usage: "Load this YAML. Enforce policies at every decision point. Apply habits at every action. Use reference_patterns as templates. Integrate compatibility entries optionally. Layer freely. Never rewrite core."